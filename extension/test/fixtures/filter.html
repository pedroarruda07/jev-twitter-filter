<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jev filter CSS regression fixture</title>
  <link rel="stylesheet" href="../../public/tags.css">
  <style>
    body { background: #15202b; color: #f5f5f5; font: 15px system-ui; padding: 32px; }
    article { max-width: 550px; border: 1px solid #536471; padding: 20px; margin-bottom: 20px; }
    header { display: flex; align-items: center; gap: 8px; }
    a { color: #8899a6; }
    .media { background: #567; height: 120px; margin-top: 12px; }
    .stacking-wrapper { position: relative; z-index: 0; transform: translateZ(0); background: #f00; }
    video { display: block; width: 100%; height: 120px; background: #ff0; position: relative; z-index: 9999; visibility: visible; }
  </style>
</head>
<body>
  <article data-testid="tweet" data-jev-filtered>
    <div class="stacking-wrapper"><div class="stacking-wrapper"><header class="stacking-wrapper">
      <span>Example author</span>
      <div class="stacking-wrapper"><a href="#">2h</a><button class="jev-post-tag" data-filtered="true" style="--jev-category-color:#7e22ce">AI-generated</button></div>
    </header><div id="content"><p>Here is an AI-generated creation.</p><div class="media">Media</div><video controls></video></div></div></div>
  </article>
  <article data-testid="tweet">
    <header><span>Example author</span><a href="#">3h</a><button class="jev-post-tag" style="--jev-category-color:#0e7490">Tech</button></header>
    <p id="visible-content">A new laptop with better battery life.</p>
  </article>
  <pre id="result">Checking…</pre>
  <script>
    try {
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      const filtered = document.querySelector("[data-jev-filtered]");
      const tag = filtered.querySelector(".jev-post-tag");
      assert(getComputedStyle(filtered).backgroundColor === "rgb(15, 23, 42)", "Filtered post must have a solid dim background");
      for (const element of filtered.querySelectorAll("*:not(.jev-post-tag)")) {
        assert(getComputedStyle(element).visibility === "hidden", "Post content, wrappers and video must all be invisible");
      }
      assert(getComputedStyle(tag).visibility === "visible", "Tag must stay visible inside nested stacking contexts");
      const tagBounds = tag.getBoundingClientRect();
      assert(document.elementFromPoint(tagBounds.x + tagBounds.width / 2, tagBounds.y + tagBounds.height / 2) === tag, "Tag must actually be on top and reachable");
      const video = filtered.querySelector("video");
      const videoBounds = video.getBoundingClientRect();
      assert(!filtered.contains(document.elementFromPoint(videoBounds.x + 20, videoBounds.y + 20)), "Hidden video must not receive interactions");
      const lateMedia = document.createElement("video");
      lateMedia.textContent = "Late media";
      filtered.firstElementChild.append(lateMedia);
      assert(getComputedStyle(lateMedia).visibility === "hidden", "New video must also be invisible");
      assert(getComputedStyle(document.querySelector("#visible-content")).visibility === "visible", "Other posts must remain visible");
      const hiddenHeight = filtered.getBoundingClientRect().height;
      filtered.removeAttribute("data-jev-filtered");
      assert(getComputedStyle(lateMedia).visibility === "visible", "Removing a filter must restore video");
      assert(getComputedStyle(document.querySelector("#content")).visibility === "visible", "Removing a filter must restore text");
      assert(filtered.getBoundingClientRect().height === hiddenHeight, "Filtering must preserve the post layout");
      filtered.setAttribute("data-jev-filtered", "");
      document.querySelector("#result").textContent = "PASS: nested content and videos invisible; tag visible and reachable; late video hidden; other posts visible; layout preserved; filter reversible.";
    } catch (error) {
      document.querySelector("#result").textContent = `FAIL: ${error.message}`;
    }
  </script>
</body>
</html>
